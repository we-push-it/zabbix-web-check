name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the release that gets template.dist.yaml
        required: true

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}

      - name: Install yq and yamllint
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends yamllint
          sudo wget --quiet --output-document /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.54.2/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Build template.dist.yaml
        run: make template.dist.yaml

      - name: Lint
        run: make lint

      - name: Attach template.dist.yaml to the release
        run: |
          sha256sum template.dist.yaml
          if gh release download "$TAG" --pattern template.dist.yaml --output attached.yaml 2>/dev/null \
            && cmp --silent attached.yaml template.dist.yaml; then
            echo "Release $TAG already has this template.dist.yaml"
          else
            gh release upload "$TAG" template.dist.yaml --clobber
          fi
