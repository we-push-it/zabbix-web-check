---
zabbix_export:
  version: '7.4'
  templates:
    - uuid: f589289cf25945c7ad8c6ef054b07c5e
      template: 'PUSH IT Webcheck'
      name: 'PUSH IT Webcheck'
      description: >-
        Checks HTTP status codes, JSON values, page load times and TLS certificates of the endpoints listed in
        {$PUSHIT.WEBCHECK.CONFIG}. All requests are made by the Zabbix agent of the host.
      groups:
        - name: Templates
      discovery_rules:
        - uuid: f5031f078c364bbe8729e85a5d58c36e
          name: Certificate
          type: SCRIPT
          key: pushit.webcheck.discovery.certificate
          delay: 10m
          params: |-
            // replaced with the content of discovery_script.js by make, see template.dist.yaml
            throw 'This is the unbuilt source template.yaml, import template.dist.yaml from https://github.com/we-push-it/zabbix-web-check/releases instead';
          filter:
            conditions:
              - macro: '{#TYPES}'
                value: '^(.+,)*certificate(,.+)*$'
          description: 'Discovery rule for items based on x509 certificate data'
          item_prototypes:
            - uuid: 6881257e2c9641039824bc4dc526e486
              name: 'Certificate data {#NAME}'
              key: 'web.certificate.get["{#URL}#{#NAME}"]'
              delay: '{$PUSHIT.WEBCHECK.CERTIFICATE.INTERVAL}'
              history: '{$PUSHIT.WEBCHECK.CERTIFICATE.HISTORY}'
              value_type: TEXT
              trigger_prototypes:
                - uuid: dd2d82fb9d1546808da3a26546c69fe5
                  expression: |
                    nodata(/PUSH IT Webcheck/web.certificate.get["{#URL}#{#NAME}"],{$PUSHIT.WEBCHECK.CERTIFICATE.NO_DATA_GRACE})=1
                  name: 'Certificate data for {#NAME} is unavailable'
                  priority: INFO
            - uuid: 26de9b6d37b84aa8b97c90eec51260c5
              name: 'Certificate expiration {#NAME}'
              type: DEPENDENT
              key: 'pushit.webcheck.certificate.not_after["{#URL}#{#NAME}"]'
              units: unixtime
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.x509.not_after.timestamp
              master_item:
                key: 'web.certificate.get["{#URL}#{#NAME}"]'
            - uuid: b349b916eefa49cca172afb02e7fe211
              name: 'Certificate validity {#NAME}'
              type: DEPENDENT
              key: 'pushit.webcheck.certificate.is_valid["{#URL}#{#NAME}"]'
              value_type: TEXT
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.result.value
              master_item:
                key: 'web.certificate.get["{#URL}#{#NAME}"]'
              trigger_prototypes:
                - uuid: 654d5ceb41a74e20b6d5725505a42db7
                  expression: 'last(/PUSH IT Webcheck/pushit.webcheck.certificate.is_valid["{#URL}#{#NAME}"]) <> "valid"'
                  name: 'Certificate for {#NAME} is invalid'
                  priority: HIGH
            - uuid: d6bfcdbd070f4f5991e9eaaf3f561b85
              name: 'Days until certificate expires ({#NAME})'
              type: DEPENDENT
              key: 'pushit.webcheck.certificate.days_until_expiration["{#URL}#{#NAME}"]'
              value_type: FLOAT
              units: '!days'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.x509.not_after.timestamp
                - type: JAVASCRIPT
                  parameters:
                    - 'return Math.round((value - Date.now() / 1000) / 86400 * 10) / 10;'
              master_item:
                key: 'web.certificate.get["{#URL}#{#NAME}"]'
              trigger_prototypes:
                - uuid: d48d334e56e34d33a43d2d95d82d4200
                  expression: |
                    last(/PUSH IT Webcheck/pushit.webcheck.certificate.days_until_expiration["{#URL}#{#NAME}"]) <= {#CERT_WARN_DAYS}
                  name: 'Certificate for {#NAME} will expire in {#CERT_WARN_DAYS} days or less (WARN)'
                  priority: WARNING
                - uuid: 1cc9cad76a92426383ab473e3c6df510
                  expression: |
                    last(/PUSH IT Webcheck/pushit.webcheck.certificate.days_until_expiration["{#URL}#{#NAME}"]) <= {#CERT_AVG_DAYS}
                  name: 'Certificate for {#NAME} will expire in {#CERT_AVG_DAYS} days or less (AVERAGE)'
                  priority: AVERAGE
                - uuid: bed26a45d9ae43ecb186433ce69a33d1
                  expression: |
                    last(/PUSH IT Webcheck/pushit.webcheck.certificate.days_until_expiration["{#URL}#{#NAME}"]) <= {#CERT_HIGH_DAYS}
                  name: 'Certificate for {#NAME} will expire in {#CERT_HIGH_DAYS} days or less (HIGH)'
                  priority: HIGH
                  description: >-
                    The certificate for {#URL} will expire in {#CERT_HIGH_DAYS} days or less. Immediate action required
                    or the monitored application will become unavailable.
          parameters:
            - name: config
              value: '{$PUSHIT.WEBCHECK.CONFIG}'
          overrides:
            - name: 'Undiscover WARN trigger'
              step: '1'
              filter:
                conditions:
                  - macro: '{#CERT_WARN_DAYS}'
                    value: ^-1$
              operations:
                - operationobject: TRIGGER_PROTOTYPE
                  operator: REGEXP
                  value: 'Certificate for .*? will expire in .*? days or less \(WARN\)'
                  discover: NO_DISCOVER
            - name: 'Undiscover AVG trigger'
              step: '2'
              filter:
                conditions:
                  - macro: '{#CERT_AVG_DAYS}'
                    value: ^-1$
              operations:
                - operationobject: TRIGGER_PROTOTYPE
                  operator: REGEXP
                  value: 'Certificate for .*? will expire in .*? days or less \(AVERAGE\)'
                  discover: NO_DISCOVER
            - name: 'Undiscover HIGH trigger'
              step: '3'
              filter:
                conditions:
                  - macro: '{#CERT_HIGH_DAYS}'
                    value: ^-1$
              operations:
                - operationobject: TRIGGER_PROTOTYPE
                  operator: REGEXP
                  value: 'Certificate for .*? will expire in .*? days or less \(HIGH\)'
                  discover: NO_DISCOVER
        - uuid: 9894a92ce16b4476a698cf55995d56ee
          name: HTTP
          type: SCRIPT
          key: pushit.webcheck.discovery.http
          delay: 10m
          params: |-
            // replaced with the content of discovery_script.js by make, see template.dist.yaml
            throw 'This is the unbuilt source template.yaml, import template.dist.yaml from https://github.com/we-push-it/zabbix-web-check/releases instead';
          filter:
            evaltype: OR
            conditions:
              - macro: '{#TYPES}'
                value: '^(.+,)*http_status(,.+)*$'
              - macro: '{#TYPES}'
                value: '^(.+,)*json_path_text(,.+)*$'
              - macro: '{#TYPES}'
                value: '^(.+,)*json_path_number(,.+)*$'
          description: 'Discovery rule for items based on an HTTP response from the endpoint'
          item_prototypes:
            - uuid: a0644fcad9c249a38f28b4285e38392c
              name: 'Response {#NAME}'
              key: 'web.page.get["{#URL}#{#NAME}"]'
              delay: '{$PUSHIT.WEBCHECK.HTTP.INTERVAL}'
              history: '0'
              value_type: TEXT
            - uuid: d62950d3aa92463e982e4a8ea60c4169
              name: 'HTTP status {#NAME}'
              type: DEPENDENT
              key: 'pushit.webcheck.http.status["{#URL}#{#NAME}"]'
              discover: NO_DISCOVER
              preprocessing:
                - type: CHECK_NOT_SUPPORTED
                  parameters:
                    - '-1'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
                - type: REGEX
                  parameters:
                    - '\A(?:HTTP/[^\n]*\n(?:[^\r\n][^\n]*\n)*\r?\n(?=HTTP/))*HTTP/[0-9.]+[ \t]+([0-9]{3})(?:[ \t]|\r?\n|$)'
                    - \1
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
              master_item:
                key: 'web.page.get["{#URL}#{#NAME}"]'
              trigger_prototypes:
                - uuid: ba3ea028aa854c2fbc62061acb70259a
                  expression: |
                    last(/PUSH IT Webcheck/pushit.webcheck.http.status["{#URL}#{#NAME}"])<>{#EXPECT_STATUS}
                    and
                    last(/PUSH IT Webcheck/pushit.webcheck.http.status["{#URL}#{#NAME}"])<>0
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: >-
                    last(/PUSH IT Webcheck/pushit.webcheck.http.status["{#URL}#{#NAME}"])={#EXPECT_STATUS}
                    or
                    count(/PUSH IT Webcheck/pushit.webcheck.http.status["{#URL}#{#NAME}"],
                    {$PUSHIT.WEBCHECK.HTTP_STATUS.NO_STATUS_GRACE},"ne","0")=0
                  name: 'Unexpected status code for {#NAME}'
                  priority: HIGH
                  description: >-
                    The status code of the monitored service does not match the expected status code {#EXPECT_STATUS}.
                    The problem stays open until the service answers with {#EXPECT_STATUS} again. If only failed
                    requests (0) arrive for {$PUSHIT.WEBCHECK.HTTP_STATUS.NO_STATUS_GRACE}, No status code for {#NAME}
                    takes over.
                - uuid: 74b6bc13eb3a435da550919fdf3cdc72
                  expression: >-
                    last(/PUSH IT Webcheck/pushit.webcheck.http.status["{#URL}#{#NAME}"])=0
                    and
                    count(/PUSH IT Webcheck/pushit.webcheck.http.status["{#URL}#{#NAME}"],
                    {$PUSHIT.WEBCHECK.HTTP_STATUS.NO_STATUS_GRACE},"ne","0")=0
                  name: 'No status code for {#NAME}'
                  priority: HIGH
                  description: >-
                    The monitored service has not answered with a status code within the last
                    {$PUSHIT.WEBCHECK.HTTP_STATUS.NO_STATUS_GRACE}: it refused the connection, did not answer within the
                    item timeout or sent no valid status line. HTTP status {#NAME} is 0 in that case.
                - uuid: 0f8fa44a14fc484b8dc9b167ed2c8111
                  expression: |
                    nodata(/PUSH IT Webcheck/pushit.webcheck.http.status["{#URL}#{#NAME}"],{$PUSHIT.WEBCHECK.HTTP_STATUS.NO_STATUS_GRACE})=1
                  name: 'No data for HTTP status {#NAME}'
                  priority: WARNING
                  description: >-
                    No value at all, not even 0, has arrived for HTTP status {#NAME} for more than
                    {$PUSHIT.WEBCHECK.HTTP_STATUS.NO_STATUS_GRACE}. The check is not running, usually because the Zabbix
                    agent or the whole host is not reachable, or because Response {#NAME} is disabled. Whether the
                    monitored service is up is unknown; if it runs on the same host, it may be down as well.
            - uuid: 4517fccf57e3473a80e786ada27dac6b
              name: 'JSON path (text) {#NAME}'
              type: DEPENDENT
              key: 'pushit.webcheck.http.json_path_text["{#URL}#{#NAME}"]'
              value_type: TEXT
              discover: NO_DISCOVER
              preprocessing:
                - type: CHECK_NOT_SUPPORTED
                  parameters:
                    - '-1'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '[no value]'
                - type: REGEX
                  parameters:
                    - '\A(?:HTTP/[^\n]*\n(?:[^\r\n][^\n]*\n)*\r?\n(?=HTTP/))*HTTP/[^\n]*\n(?:[^\r\n][^\n]*\n)*\r?\n[^{\[]*([\s\S]*)'
                    - \1
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '[no value]'
                - type: JSONPATH
                  parameters:
                    - '{#JSON_PATH_TEXT}'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '[no value]'
              master_item:
                key: 'web.page.get["{#URL}#{#NAME}"]'
              trigger_prototypes:
                - uuid: 9a42683503184a378dc57cc56f3b0d6b
                  expression: |
                    last(/PUSH IT Webcheck/pushit.webcheck.http.json_path_text["{#URL}#{#NAME}"])<>"{#EXPECT_VALUE_TEXT}"
                    and
                    last(/PUSH IT Webcheck/pushit.webcheck.http.json_path_text["{#URL}#{#NAME}"])<>"[no value]"
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: >-
                    last(/PUSH IT Webcheck/pushit.webcheck.http.json_path_text["{#URL}#{#NAME}"])="{#EXPECT_VALUE_TEXT}"
                    or
                    count(/PUSH IT Webcheck/pushit.webcheck.http.json_path_text["{#URL}#{#NAME}"],
                    {$PUSHIT.WEBCHECK.JSON_PATH.NO_RESPONSE_GRACE},"ne","[no value]")=0
                  name: 'JSON value for {#NAME} does not match expected value (text)'
                  priority: HIGH
                  discover: NO_DISCOVER
                  description: >-
                    The value at "{#JSON_PATH_TEXT}" in the response of the monitored service does not match the
                    expected value "{#EXPECT_VALUE_TEXT}". The problem stays open until the service answers with that
                    value again. If only [no value] arrives for {$PUSHIT.WEBCHECK.JSON_PATH.NO_RESPONSE_GRACE}, No JSON
                    value for {#NAME} (text) takes over.
                - uuid: da42163600d148818d06da0adfbffc42
                  expression: |
                    last(/PUSH IT Webcheck/pushit.webcheck.http.json_path_text["{#URL}#{#NAME}"])="{#EXPECT_VALUE_TEXT}"
                    and
                    last(/PUSH IT Webcheck/pushit.webcheck.http.json_path_text["{#URL}#{#NAME}"])<>"[no value]"
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: >-
                    last(/PUSH IT Webcheck/pushit.webcheck.http.json_path_text["{#URL}#{#NAME}"])<>"{#EXPECT_VALUE_TEXT}"
                    and
                    last(/PUSH IT Webcheck/pushit.webcheck.http.json_path_text["{#URL}#{#NAME}"])<>"[no value]"
                    or
                    count(/PUSH IT Webcheck/pushit.webcheck.http.json_path_text["{#URL}#{#NAME}"],
                    {$PUSHIT.WEBCHECK.JSON_PATH.NO_RESPONSE_GRACE},"ne","[no value]")=0
                  name: 'JSON value for {#NAME} matches prohibited value (text)'
                  priority: HIGH
                  discover: NO_DISCOVER
                  description: >-
                    The value at "{#JSON_PATH_TEXT}" in the response of the monitored service matches the prohibited
                    value "{#EXPECT_VALUE_TEXT}". The problem stays open until the service answers with another value.
                    If only [no value] arrives for {$PUSHIT.WEBCHECK.JSON_PATH.NO_RESPONSE_GRACE}, No JSON value for
                    {#NAME} (text) takes over.
                - uuid: e704b580f33040b8bb0183abf564358f
                  expression: >-
                    last(/PUSH IT Webcheck/pushit.webcheck.http.json_path_text["{#URL}#{#NAME}"])="[no value]"
                    and
                    count(/PUSH IT Webcheck/pushit.webcheck.http.json_path_text["{#URL}#{#NAME}"],
                    {$PUSHIT.WEBCHECK.JSON_PATH.NO_RESPONSE_GRACE},"ne","[no value]")=0
                  name: 'No JSON value for {#NAME} (text)'
                  priority: HIGH
                  description: >-
                    No value could be read at "{#JSON_PATH_TEXT}" in the responses of the monitored service within the
                    last {$PUSHIT.WEBCHECK.JSON_PATH.NO_RESPONSE_GRACE}: the service did not answer, the body is not
                    JSON or the path does not exist. JSON path (text) {#NAME} is [no value] in that case.
                - uuid: 656b1595bc2845e4b09aef1897a25b80
                  expression: >-
                    nodata(/PUSH IT Webcheck/pushit.webcheck.http.json_path_text["{#URL}#{#NAME}"],
                    {$PUSHIT.WEBCHECK.JSON_PATH.NO_RESPONSE_GRACE})=1
                  name: 'No data for JSON path (text) {#NAME}'
                  priority: WARNING
                  description: >-
                    No value at all, not even [no value], has arrived for JSON path (text) {#NAME} for more than
                    {$PUSHIT.WEBCHECK.JSON_PATH.NO_RESPONSE_GRACE}. The check is not running, usually because the Zabbix
                    agent or the whole host is not reachable, or because Response {#NAME} is disabled. Whether the
                    monitored service is up is unknown; if it runs on the same host, it may be down as well.
            - uuid: 924b1fa1897f441388287043b06567f0
              name: 'JSON path (number) {#NAME}'
              type: DEPENDENT
              key: 'pushit.webcheck.http.json_path_number["{#URL}#{#NAME}"]'
              value_type: FLOAT
              discover: NO_DISCOVER
              preprocessing:
                - type: REGEX
                  parameters:
                    - '\A(?:HTTP/[^\n]*\n(?:[^\r\n][^\n]*\n)*\r?\n(?=HTTP/))*HTTP/[^\n]*\n(?:[^\r\n][^\n]*\n)*\r?\n[^{\[]*([\s\S]*)'
                    - \1
                - type: JSONPATH
                  parameters:
                    - '{#JSON_PATH_NUMBER}'
              master_item:
                key: 'web.page.get["{#URL}#{#NAME}"]'
            - uuid: ffe03c9c6eea48e5a1fc2668579a4e57
              name: 'JSON path (number) readable {#NAME}'
              type: DEPENDENT
              key: 'pushit.webcheck.http.json_path_number.readable["{#URL}#{#NAME}"]'
              discover: NO_DISCOVER
              description: >-
                1 if a number could be read at "{#JSON_PATH_NUMBER}" in the last response of the monitored service, 0 if
                the request failed, the body is not JSON, the path does not exist or the value there is not a number.
                JSON path (number) {#NAME} is not supported in that case. The triggers of the number check use this item
                to tell a failing service (0) from a check that does not run at all (no value).
              preprocessing:
                - type: CHECK_NOT_SUPPORTED
                  parameters:
                    - '-1'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '[no value]'
                - type: REGEX
                  parameters:
                    - '\A(?:HTTP/[^\n]*\n(?:[^\r\n][^\n]*\n)*\r?\n(?=HTTP/))*HTTP/[^\n]*\n(?:[^\r\n][^\n]*\n)*\r?\n[^{\[]*([\s\S]*)'
                    - \1
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '[no value]'
                - type: JSONPATH
                  parameters:
                    - '{#JSON_PATH_NUMBER}'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '[no value]'
                - type: REGEX
                  parameters:
                    - '\A *("?)[+-]?(?:[0-9]+\.?[0-9]*|\.[0-9]+)(?:[eE][+-]?[0-9]+)?\1 *[\r\n]*\z'
                    - '1'
                  error_handler: CUSTOM_VALUE
                  error_handler_params: '0'
              master_item:
                key: 'web.page.get["{#URL}#{#NAME}"]'
              trigger_prototypes:
                - uuid: 792d81bcdbb24e16a441aa8c8cd9dc22
                  expression: >-
                    last(/PUSH IT Webcheck/pushit.webcheck.http.json_path_number.readable["{#URL}#{#NAME}"])=0
                    and
                    count(/PUSH IT Webcheck/pushit.webcheck.http.json_path_number.readable["{#URL}#{#NAME}"],
                    {$PUSHIT.WEBCHECK.JSON_PATH.NO_RESPONSE_GRACE},"ne","0")=0
                  name: 'No JSON value for {#NAME} (number)'
                  priority: HIGH
                  description: >-
                    No number could be read at "{#JSON_PATH_NUMBER}" in the responses of the monitored service within
                    the last {$PUSHIT.WEBCHECK.JSON_PATH.NO_RESPONSE_GRACE}: the service did not answer, the body is not
                    JSON, the path does not exist or the value there is not a number. JSON path (number) readable
                    {#NAME} is 0 in that case.
                - uuid: 88adb01d02274961bf3dbadf8f7a92d0
                  expression: >-
                    nodata(/PUSH IT Webcheck/pushit.webcheck.http.json_path_number.readable["{#URL}#{#NAME}"],
                    {$PUSHIT.WEBCHECK.JSON_PATH.NO_RESPONSE_GRACE})=1
                  name: 'No data for JSON path (number) {#NAME}'
                  priority: WARNING
                  description: >-
                    No value at all, not even 0, has arrived for JSON path (number) readable {#NAME} for more than
                    {$PUSHIT.WEBCHECK.JSON_PATH.NO_RESPONSE_GRACE}. The check is not running, usually because the Zabbix
                    agent or the whole host is not reachable, or because Response {#NAME} is disabled. Whether the
                    monitored service is up is unknown; if it runs on the same host, it may be down as well.
          trigger_prototypes:
            - uuid: 5fb89ee56ac94b8d9e716ca51dc7f685
              expression: |
                last(/PUSH IT Webcheck/pushit.webcheck.http.json_path_number["{#URL}#{#NAME}"])<>{#EXPECT_VALUE_NUMBER}
                and
                last(/PUSH IT Webcheck/pushit.webcheck.http.json_path_number.readable["{#URL}#{#NAME}"])=1
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: >-
                last(/PUSH IT Webcheck/pushit.webcheck.http.json_path_number.readable["{#URL}#{#NAME}"])=1
                or
                count(/PUSH IT Webcheck/pushit.webcheck.http.json_path_number.readable["{#URL}#{#NAME}"],1s)>0
                and
                count(/PUSH IT Webcheck/pushit.webcheck.http.json_path_number.readable["{#URL}#{#NAME}"],
                {$PUSHIT.WEBCHECK.JSON_PATH.NO_RESPONSE_GRACE},"ne","0")=0
              name: 'JSON value for {#NAME} does not match expected value (number)'
              priority: HIGH
              discover: NO_DISCOVER
              description: >-
                The value at "{#JSON_PATH_NUMBER}" in the response of the monitored service does not match the expected
                value {#EXPECT_VALUE_NUMBER}. The problem stays open until the service answers with a number that
                satisfies the comparison again. If no number can be read for
                {$PUSHIT.WEBCHECK.JSON_PATH.NO_RESPONSE_GRACE}, No JSON value for {#NAME} (number) takes over.
            - uuid: 0cefa5a1d58446be8ea2762cafdf0b62
              expression: |
                last(/PUSH IT Webcheck/pushit.webcheck.http.json_path_number["{#URL}#{#NAME}"])={#EXPECT_VALUE_NUMBER}
                and
                last(/PUSH IT Webcheck/pushit.webcheck.http.json_path_number.readable["{#URL}#{#NAME}"])=1
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: >-
                last(/PUSH IT Webcheck/pushit.webcheck.http.json_path_number.readable["{#URL}#{#NAME}"])=1
                or
                count(/PUSH IT Webcheck/pushit.webcheck.http.json_path_number.readable["{#URL}#{#NAME}"],1s)>0
                and
                count(/PUSH IT Webcheck/pushit.webcheck.http.json_path_number.readable["{#URL}#{#NAME}"],
                {$PUSHIT.WEBCHECK.JSON_PATH.NO_RESPONSE_GRACE},"ne","0")=0
              name: 'JSON value for {#NAME} matches prohibited value (number)'
              priority: HIGH
              discover: NO_DISCOVER
              description: >-
                The value at "{#JSON_PATH_NUMBER}" in the response of the monitored service matches the prohibited value
                {#EXPECT_VALUE_NUMBER}. The problem stays open until the service answers with a number that satisfies
                the comparison again. If no number can be read for {$PUSHIT.WEBCHECK.JSON_PATH.NO_RESPONSE_GRACE}, No
                JSON value for {#NAME} (number) takes over.
            - uuid: f9f4429faf20486d8f574e5a055d5eea
              expression: |
                last(/PUSH IT Webcheck/pushit.webcheck.http.json_path_number["{#URL}#{#NAME}"])>={#EXPECT_VALUE_NUMBER}
                and
                last(/PUSH IT Webcheck/pushit.webcheck.http.json_path_number.readable["{#URL}#{#NAME}"])=1
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: >-
                last(/PUSH IT Webcheck/pushit.webcheck.http.json_path_number.readable["{#URL}#{#NAME}"])=1
                or
                count(/PUSH IT Webcheck/pushit.webcheck.http.json_path_number.readable["{#URL}#{#NAME}"],1s)>0
                and
                count(/PUSH IT Webcheck/pushit.webcheck.http.json_path_number.readable["{#URL}#{#NAME}"],
                {$PUSHIT.WEBCHECK.JSON_PATH.NO_RESPONSE_GRACE},"ne","0")=0
              name: 'JSON value for {#NAME} is not below expected limit (number)'
              priority: HIGH
              discover: NO_DISCOVER
              description: >-
                The value at "{#JSON_PATH_NUMBER}" in the response of the monitored service must be less than
                {#EXPECT_VALUE_NUMBER}, but is greater than or equal to that limit. The problem stays open until the
                service answers with a number that satisfies the comparison again. If no number can be read for
                {$PUSHIT.WEBCHECK.JSON_PATH.NO_RESPONSE_GRACE}, No JSON value for {#NAME} (number) takes over.
            - uuid: 2c87fac4270d44e38810fcb6e3698623
              expression: |
                last(/PUSH IT Webcheck/pushit.webcheck.http.json_path_number["{#URL}#{#NAME}"])>{#EXPECT_VALUE_NUMBER}
                and
                last(/PUSH IT Webcheck/pushit.webcheck.http.json_path_number.readable["{#URL}#{#NAME}"])=1
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: >-
                last(/PUSH IT Webcheck/pushit.webcheck.http.json_path_number.readable["{#URL}#{#NAME}"])=1
                or
                count(/PUSH IT Webcheck/pushit.webcheck.http.json_path_number.readable["{#URL}#{#NAME}"],1s)>0
                and
                count(/PUSH IT Webcheck/pushit.webcheck.http.json_path_number.readable["{#URL}#{#NAME}"],
                {$PUSHIT.WEBCHECK.JSON_PATH.NO_RESPONSE_GRACE},"ne","0")=0
              name: 'JSON value for {#NAME} exceeds expected maximum (number)'
              priority: HIGH
              discover: NO_DISCOVER
              description: >-
                The value at "{#JSON_PATH_NUMBER}" in the response of the monitored service must be less than or equal
                to {#EXPECT_VALUE_NUMBER}, but exceeds that limit. The problem stays open until the service answers with
                a number that satisfies the comparison again. If no number can be read for
                {$PUSHIT.WEBCHECK.JSON_PATH.NO_RESPONSE_GRACE}, No JSON value for {#NAME} (number) takes over.
            - uuid: a0e9315f06b9422d9c26878a52bb4cf0
              expression: |
                last(/PUSH IT Webcheck/pushit.webcheck.http.json_path_number["{#URL}#{#NAME}"])<={#EXPECT_VALUE_NUMBER}
                and
                last(/PUSH IT Webcheck/pushit.webcheck.http.json_path_number.readable["{#URL}#{#NAME}"])=1
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: >-
                last(/PUSH IT Webcheck/pushit.webcheck.http.json_path_number.readable["{#URL}#{#NAME}"])=1
                or
                count(/PUSH IT Webcheck/pushit.webcheck.http.json_path_number.readable["{#URL}#{#NAME}"],1s)>0
                and
                count(/PUSH IT Webcheck/pushit.webcheck.http.json_path_number.readable["{#URL}#{#NAME}"],
                {$PUSHIT.WEBCHECK.JSON_PATH.NO_RESPONSE_GRACE},"ne","0")=0
              name: 'JSON value for {#NAME} is not above expected limit (number)'
              priority: HIGH
              discover: NO_DISCOVER
              description: >-
                The value at "{#JSON_PATH_NUMBER}" in the response of the monitored service must be greater than
                {#EXPECT_VALUE_NUMBER}, but is less than or equal to that limit. The problem stays open until the
                service answers with a number that satisfies the comparison again. If no number can be read for
                {$PUSHIT.WEBCHECK.JSON_PATH.NO_RESPONSE_GRACE}, No JSON value for {#NAME} (number) takes over.
            - uuid: 1dc538495f45492e9abf7069061fbf03
              expression: |
                last(/PUSH IT Webcheck/pushit.webcheck.http.json_path_number["{#URL}#{#NAME}"])<{#EXPECT_VALUE_NUMBER}
                and
                last(/PUSH IT Webcheck/pushit.webcheck.http.json_path_number.readable["{#URL}#{#NAME}"])=1
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: >-
                last(/PUSH IT Webcheck/pushit.webcheck.http.json_path_number.readable["{#URL}#{#NAME}"])=1
                or
                count(/PUSH IT Webcheck/pushit.webcheck.http.json_path_number.readable["{#URL}#{#NAME}"],1s)>0
                and
                count(/PUSH IT Webcheck/pushit.webcheck.http.json_path_number.readable["{#URL}#{#NAME}"],
                {$PUSHIT.WEBCHECK.JSON_PATH.NO_RESPONSE_GRACE},"ne","0")=0
              name: 'JSON value for {#NAME} is below expected minimum (number)'
              priority: HIGH
              discover: NO_DISCOVER
              description: >-
                The value at "{#JSON_PATH_NUMBER}" in the response of the monitored service must be greater than or
                equal to {#EXPECT_VALUE_NUMBER}, but is below that limit. The problem stays open until the service
                answers with a number that satisfies the comparison again. If no number can be read for
                {$PUSHIT.WEBCHECK.JSON_PATH.NO_RESPONSE_GRACE}, No JSON value for {#NAME} (number) takes over.
          parameters:
            - name: config
              value: '{$PUSHIT.WEBCHECK.CONFIG}'
          overrides:
            - name: 'Enable http_status'
              step: '1'
              filter:
                conditions:
                  - macro: '{#TYPES}'
                    value: '^(.+,)*http_status(,.+)*$'
              operations:
