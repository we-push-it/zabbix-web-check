        - uuid: 97859698c0824a8fa019ae4fcb2aedca
          name: Performance
          type: SCRIPT
          key: pushit.webcheck.discovery.performance
          delay: 10m
          params: |-
            // replaced with the content of discovery_script.js by make, see template.dist.yaml
            throw 'This is the unbuilt source template.yaml, import template.dist.yaml from https://github.com/we-push-it/zabbix-web-check/releases instead';
          filter:
            conditions:
              - macro: '{#TYPES}'
                value: '^(.+,)*http_performance(,.+)*$'
          description: 'Discovery rule for HTTP performance checks for the endpoint'
          item_prototypes:
            - uuid: 252b7ac30a05405c91546f13199c172e
              name: 'HTTP performance {#NAME}'
              key: 'web.page.perf["{#URL}#{#NAME}"]'
              delay: '{$PUSHIT.WEBCHECK.HTTP.INTERVAL}'
              value_type: FLOAT
              timeout: '{#PERF_TIMEOUT}'
              trigger_prototypes:
                - uuid: 8fda601e87fa4a52ae7c1ec2e8085129
                  expression: nodata(/PUSH IT Webcheck/web.page.perf["{#URL}#{#NAME}"],{#PERF_NODATA})=1
                  name: 'Missing HTTP performance data for {#NAME}'
                  priority: WARNING
                  description: >-
                    No load time has been measured for {#NAME} for {#PERF_NODATA}: the request failed or took longer
                    than the item timeout of {#PERF_TIMEOUT}, or the check is not running, for example because the
                    Zabbix agent is not reachable. The threshold triggers keep their last state until a load time is
                    measured again.
                - uuid: c014d2e41ba740ce83092e0cfc5fd084
                  expression: last(/PUSH IT Webcheck/web.page.perf["{#URL}#{#NAME}"])>{#PERF_WARN}
                  name: 'Performance of {#NAME} exceeds WARN limit'
                  priority: WARNING
                - uuid: e8fd416c7da241a3b2695a7494fd1820
                  expression: last(/PUSH IT Webcheck/web.page.perf["{#URL}#{#NAME}"])>{#PERF_AVG}
                  name: 'Performance of {#NAME} exceeds AVERAGE limit'
                  priority: AVERAGE
                - uuid: 3353afe283c0411181e96c7326ec4786
                  expression: last(/PUSH IT Webcheck/web.page.perf["{#URL}#{#NAME}"])>{#PERF_HIGH}
                  name: 'Performance of {#NAME} exceeds HIGH limit'
                  priority: HIGH
                - uuid: 2d02dc6a916d4fc2befc5daaa12ad680
                  expression: last(/PUSH IT Webcheck/web.page.perf["{#URL}#{#NAME}"])>{#PERF_DISASTER}
                  name: 'Performance of {#NAME} exceeds DISASTER limit'
                  priority: DISASTER
          parameters:
            - name: config
              value: '{$PUSHIT.WEBCHECK.CONFIG}'
          overrides:
            - name: 'Undiscover WARN trigger'
              step: '1'
              filter:
                conditions:
                  - macro: '{#PERF_WARN}'
                    value: ^-1$
              operations:
                - operationobject: TRIGGER_PROTOTYPE
                  operator: REGEXP
                  value: 'Performance of .*? exceeds WARN limit'
                  discover: NO_DISCOVER
            - name: 'Undiscover AVG trigger'
              step: '2'
              filter:
                conditions:
                  - macro: '{#PERF_AVG}'
                    value: ^-1$
              operations:
                - operationobject: TRIGGER_PROTOTYPE
                  operator: REGEXP
                  value: 'Performance of .*? exceeds AVERAGE limit'
